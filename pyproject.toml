[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feinsum_evaluation"
version = "2025.0"
description = "Evaluation toolkit for feinsum."
authors = [
    { name = "Kaushik Kulkarni", email = "kaushikcfd@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
urls = { Homepage = "https://github.com/kaushikcfd/feinsum-evaluation/" }
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
  "arraycontext",
  "feinsum",
  "jax",
  "loopy",
  "pyopencl",
  "pytato",
  "tabulate"
]


[tool.ruff]
preview = true
line-length = 85

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear
  "C",   # flake8-comprehensions
  "E",   # pycodestyle
  "F",   # pyflakes

  "I",   # flake8-isort

  "N",   # pep8-naming
  "NPY", # numpy
  "Q",   # flake8-quotes
  "W",   # pycodestyle

  "UP",  # pyupgrade
  "RUF",  # ruff
  "FA",
  "TC",
]

ignore = ["B023", "C901", "N803", "N806"]

[tool.black]
line-length = 85
